version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next-ecosystem:
        patterns: [next, react, react-dom, "@types/react*"]
      tailwind:
        patterns: [tailwindcss, "@tailwindcss/*", postcss*]
    ignore:
      # Only accept patch/minor for supabase to avoid breaking auth changes
      - dependency-name: "@supabase/supabase-js"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
